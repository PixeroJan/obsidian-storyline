name: Release

# Builds main.js, manifest.json, and styles.css on Ubuntu (matching the
# Obsidian community plugin scanner's environment) and attaches them to a
# GitHub Release when manually dispatched with a version.
#
# Usage:
#   1. Copy the updated plugin files into the local GitHub repository.
#   2. Commit and push those files with GitHub Desktop.
#   3. Run this workflow manually and enter the release version.
#   4. The workflow bumps version files, builds on Linux, creates the tag,
#      and publishes the release assets.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.10.77)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need full history + write access for the version and release commit.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        id: rel
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20.19.1
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.8.2

      - name: Verify release metadata
        env:
          RELEASE_VERSION: ${{ steps.rel.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const version = process.env.RELEASE_VERSION;
          const read = file => JSON.parse(fs.readFileSync(file, 'utf8').replace(/^\uFEFF/, ''));
          const manifest = read('manifest.json');
          const packageJson = read('package.json');
          const lock = read('package-lock.json');
          const lockRoot = lock.packages && lock.packages[''];
          const actual = {
            manifest: manifest.version,
            package: packageJson.version,
            lock: lock.version,
            lockRoot: lockRoot && lockRoot.version,
          };
          if (Object.values(actual).some(value => value !== version)) {
            console.error(`Release ${version} does not match release metadata: ${JSON.stringify(actual)}`);
            process.exit(1);
          }
          if (!fs.existsSync('versions.json') || read('versions.json')[version] !== manifest.minAppVersion) {
            console.error(`versions.json does not contain the expected entry for ${version}`);
            process.exit(1);
          }
          NODE

      - name: Install dependencies (exact lockfile)
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Verify build artifacts exist
        run: |
          test -f main.js      || { echo "main.js missing";  exit 1; }
          test -f manifest.json || { echo "manifest.json missing"; exit 1; }
          test -f styles.css    || { echo "styles.css missing"; exit 1; }
          sha256sum main.js

      - name: Commit version and build output
        env:
          RELEASE_VERSION: ${{ steps.rel.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json package-lock.json versions.json main.js
          git commit -m "Release $RELEASE_VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create release tag
        env:
          RELEASE_VERSION: ${{ steps.rel.outputs.version }}
        run: |
          git tag "$RELEASE_VERSION"
          git push origin "$RELEASE_VERSION"

      - name: Create / update GitHub Release with build assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.version }}
          # Use the tag name as the release title.
          name: ${{ steps.rel.outputs.version }}
          # Pull release notes from the matching CHANGELOG section.
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for release notes.
          files: |
            main.js
            manifest.json
            styles.css
          fail_on_unmatched_files: true
          overwrite_files: true
